name: My Weekend Demo Workflow

on:
  push:
    branches: main

  workflow_dispatch:

env:
  APPNAME: "my-python-app"

permissions: 
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6.1.0

      - name: Setup Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Run pytest
        run: pytest test_app.py

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-demo1
          path: .

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6.1.0

      - name: Check OIDC claims
        run: |
            TOKEN_JSON=$(curl -s \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com")

            ID_TOKEN=$(echo "$TOKEN_JSON" | jq -r '.value')

            PAYLOAD=$(echo "$ID_TOKEN" | cut -d '.' -f2)
            PAYLOAD="${PAYLOAD}$(printf '%*s' $((4-${#PAYLOAD}%4)) '' | tr ' ' '=')"

            echo "$PAYLOAD" | base64 -d 2>/dev/null | jq '{aud,sub}'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::704048935634:role/githubdemoecrrole0609
          aws-region: ap-southeast-1

      - name: Test AWS connection
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push docker image to Amazon ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: myweekenddemo
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $REGISTRY/$REPOSITORY:$IMAGE_TAG .
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG
        
